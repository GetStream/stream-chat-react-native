def kotlinVersion =
  rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion")
    : project.properties["ImageResizer_kotlinVersion"]

buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: "kotlin-android"
}


def appProject = rootProject.allprojects.find { it.plugins.hasPlugin('com.android.application') }

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ImageResizer_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ImageResizer_" + name]).toInteger()
}
def canonicalProjectDir = projectDir.getCanonicalFile()
def localSharedNativeRootDir = new File(projectDir, "src/main/java/com/streamchatreactnative/shared")
def sharedNativeRootDir = new File(canonicalProjectDir, "../../shared-native/android")
def hasNativeSources = { File dir ->
  dir.exists() && !fileTree(dir).matching { include "**/*.kt"; include "**/*.java" }.files.isEmpty()
}

android {
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")
  def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
  def agpMajorVersion = agpVersion.tokenize('.')[0].toInteger()
  def agpMinorVersion = agpVersion.tokenize('.')[1].toInteger()
  /**
  * Namespace should be declared here starting from AGP 8.x, Starting AGP 7.3 it is also supported.
  * For AGP < 7.3, namespace should be declared in AndroidManifest.
  * See: https://developer.android.com/build/releases/past-releases/agp-8-0-0-release-notes#namespace-dsl
  */
  if (agpMajorVersion >= 7 && agpMinorVersion >= 3) {
      namespace "com.streamchatreactnative"
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    // Must match the Kotlin jvmTarget below. AGP 9 (React Native 0.87) fails the build on an
    // inconsistent JVM-target between the Java and Kotlin compilation tasks.
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "src/newarch",
          "src/main/java/com/streamchatreactnative/shared",
          // This is needed to build Kotlin project with NewArch enabled
          "${project.buildDir}/generated/source/codegen/java"
        ]
      } else {
        java.srcDirs += ["src/oldarch"]
      }
    }
  }
}

tasks.register("syncSharedShimmerSources") {
  outputs.dir(localSharedNativeRootDir)
  outputs.upToDateWhen { false }
  doLast {
    def sourceRootDir = null
    if (hasNativeSources(sharedNativeRootDir)) {
      sourceRootDir = sharedNativeRootDir
    } else if (hasNativeSources(localSharedNativeRootDir)) {
      sourceRootDir = localSharedNativeRootDir
    }

    if (sourceRootDir == null) {
      throw new GradleException(
        "Missing shared native Android sources. Expected either src/main/java/com/streamchatreactnative/shared/**/*.{kt,java} " +
          "or ../../shared-native/android/**/*.{kt,java}."
      )
    }

    if (sourceRootDir != localSharedNativeRootDir) {
      project.delete(localSharedNativeRootDir)
      project.copy {
        from(sourceRootDir)
        into(localSharedNativeRootDir)
      }
    } else if (!hasNativeSources(localSharedNativeRootDir)) {
      throw new GradleException("Shared native source directory exists but has no Kotlin/Java files.")
    }
  }
}

tasks.matching { it.name == "preBuild" }.configureEach {
  dependsOn("syncSharedShimmerSources")
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  dependsOn("syncSharedShimmerSources")
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "androidx.exifinterface:exifinterface:1.3.2"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "StreamChatReactNative"
    codegenJavaPackageName = "com.streamchatreactnative"
  }
}

if (isNewArchitectureEnabled()) {
  gradle.projectsEvaluated {
    if (rootProject.ext.has("streamChatReactNativeCodegenHookInstalled")) {
      return
    }

    def androidAppProject = rootProject.subprojects.find { it.plugins.hasPlugin("com.android.application") }
    if (androidAppProject == null) {
      return
    }

    def dependencyCodegenTasks = rootProject.subprojects
      .findAll { it != androidAppProject }
      .collect { it.tasks.findByName("generateCodegenArtifactsFromSchema") }
      .findAll { it != null }

    if (dependencyCodegenTasks.isEmpty()) {
      return
    }

    rootProject.ext.set("streamChatReactNativeCodegenHookInstalled", true)

    androidAppProject.tasks.matching { task ->
      task.name.startsWith("configureCMake")
    }.configureEach {
      dependsOn(dependencyCodegenTasks)
    }
  }
}
