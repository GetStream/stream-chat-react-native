buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

ext.REACT_NATIVE_NODE_MODULES_DIR = file("$rootDir/../node_modules/react-native").absolutePath
ext.REACT_NATIVE_WORKLETS_NODE_MODULES_DIR =
    file("$rootDir/../node_modules/react-native-worklets").absolutePath

allprojects {
    repositories {
        // Detox's Android library ships inside its npm package
        maven {
            url "$rootDir/../node_modules/detox/Detox-android"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
