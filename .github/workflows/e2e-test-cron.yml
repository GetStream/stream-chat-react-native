name: E2E Tests Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ios:
        description: "Run iOS e2e tests"
        type: boolean
        default: true
      android:
        description: "Run Android e2e tests"
        type: boolean
        default: true
      mock_server_branch:
        description: "stream-chat-test-mock-server branch"
        type: string
        default: "main"

permissions:
  contents: read
  # Downloads the previous map, whose coverage failed tests keep.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MOCK_SERVER_BRANCH: ${{ inputs.mock_server_branch || 'main' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  # node_modules of the e2e app and the workspaces it depends on (nmHoistingLimits: workspaces
  # keeps them apart); `yarn workspaces focus` installs nothing else.
  NODE_MODULES_PATHS: |
    node_modules
    configs/*/node_modules
    package/node_modules
    package/native-package/node_modules
    examples/E2ETestApp/node_modules
    .yarn/install-state.gz

jobs:
  ios:
    name: Test iOS ${{ matrix.ios }}
    if: github.event_name == 'schedule' || inputs.ios
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: "26.2"
            device: "iPhone 17 Pro"
            setup_runtime: false
          # The oldest runtime the Flutter nightly covers; the runner image doesn't ship it.
          - ios: "17.5"
            device: "iPhone 15 Pro"
            setup_runtime: true
    env:
      DETOX_IOS_DEVICE: ${{ matrix.device }}
      IOS_VERSION: ${{ matrix.ios }}
      # Pinned to match the simulator runtimes this job selects.
      XCODE_VERSION: "26.2"
      APP_PATH: examples/E2ETestApp/ios/build/detox/Build/Products/Release-iphonesimulator/E2ETestApp.app
      MOCK_SERVER_BUNDLE_PATH: ${{ github.workspace }}/../mock-server-gems
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: ./.github/actions/ruby-cache
      - uses: ./.github/actions/setup-ios-runtime
        if: matrix.setup_runtime
        with:
          version: ${{ matrix.ios }}
          device: ${{ matrix.device }}
      # A fresh simulator takes minutes to boot on CI; boot it now so that overlaps with setup.
      - name: Boot simulator
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          udid=$(xcrun simctl list devices available -j |
            jq -r --arg rt "$runtime" --arg name "$DETOX_IOS_DEVICE" '.devices[$rt][]? | select(.name == $name) | .udid' | head -1)
          if [ -z "$udid" ]; then
            # Detox would pick a simulator of the same type on another iOS version.
            if [ "${{ matrix.setup_runtime }}" = "true" ]; then
              echo "::error::No $DETOX_IOS_DEVICE on iOS $IOS_VERSION"
              exit 1
            fi
            echo "::warning::No $DETOX_IOS_DEVICE on iOS $IOS_VERSION; Detox will pick and boot a simulator itself"
            exit 0
          fi
          echo "DETOX_IOS_UDID=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$udid" > /dev/null 2>&1 &

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn workspaces focus e2etestapp
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # --- App binary: rebuilt only when the app or SDK sources change, not for test-only changes ---
      - name: Restore app
        id: app
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.APP_PATH }}
          key: e2e-ios-app-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('yarn.lock', 'package/package.json', 'package/src/**', 'package/shared-native/**', 'package/native-package/package.json', 'package/native-package/src/**', 'package/native-package/ios/**', 'package/native-package/*.podspec', 'examples/SampleApp/Gemfile.lock', 'examples/E2ETestApp/*.js', '!examples/E2ETestApp/.detoxrc.js', 'examples/E2ETestApp/*.json', 'examples/E2ETestApp/*.tsx', 'examples/E2ETestApp/src/**', 'examples/E2ETestApp/ios/**', '!examples/E2ETestApp/ios/build/**', '!examples/E2ETestApp/ios/Pods/**') }}
      - name: Set up ccache
        if: steps.app.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: e2e-ios-xcode${{ env.XCODE_VERSION }}
          max-size: 1500M
      - name: Point the RN ccache wrappers at ccache
        if: steps.app.outputs.cache-hit != 'true'
        # RN's ccache-clang.sh runs `$CCACHE_BINARY clang`, but Xcode doesn't export that build
        # setting to the compiler, so without this every compile silently skips ccache.
        run: echo "CCACHE_BINARY=$(which ccache)" >> "$GITHUB_ENV"
      - name: Cache pods
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: examples/E2ETestApp/ios/Pods
          key: ${{ runner.os }}-e2e-pods-${{ hashFiles('examples/E2ETestApp/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-pods-
      - name: Install pods
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: examples/SampleApp
        run: USE_CCACHE=1 bundle exec fastlane e2e_pod_install
      - name: Build app
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: examples/E2ETestApp
        run: yarn e2e:build -c ios.sim.release
      - name: Save app
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.APP_PATH }}
          key: ${{ steps.app.outputs.cache-primary-key }}

      - name: Install applesimutils
        # Homebrew refuses formulae from non-official taps until they are trusted.
        run: brew tap wix/brew && brew trust --formula wix/brew/applesimutils && brew install wix/brew/applesimutils
      - name: Restore Detox framework
        id: detox-framework
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Detox
          key: ${{ runner.os }}-detox-framework-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('yarn.lock') }}
      # Yarn's `enableScripts: false` skips Detox's postinstall, which would build this.
      - name: Build Detox framework
        if: steps.detox-framework.outputs.cache-hit != 'true'
        working-directory: examples/E2ETestApp
        run: yarn detox build-framework-cache
      - name: Save Detox framework
        if: steps.detox-framework.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/Library/Detox
          key: ${{ steps.detox-framework.outputs.cache-primary-key }}
      - name: Resolve mock server revision
        id: mock-server
        run: echo "sha=$(git ls-remote https://github.com/GetStream/stream-chat-test-mock-server "refs/heads/$MOCK_SERVER_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache mock server gems
        uses: actions/cache@v5
        with:
          path: ${{ env.MOCK_SERVER_BUNDLE_PATH }}
          key: ${{ runner.os }}-mock-server-gems-${{ steps.mock-server.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-mock-server-gems-

      - name: Wait for the simulator
        if: env.DETOX_IOS_UDID != ''
        timeout-minutes: 15
        # `-b` boots it if the background boot never started; it errors (405) when the device is
        # already booted, and then the plain call returns at once.
        run: xcrun simctl bootstatus "$DETOX_IOS_UDID" -b || xcrun simctl bootstatus "$DETOX_IOS_UDID"
      - name: Launch Allure TestOps
        if: env.ALLURE_TOKEN != ''
        working-directory: examples/SampleApp
        run: bundle exec fastlane allure_launch cron:true
        continue-on-error: true
      # A macos-15 runner is about 4x slower than an M-series Mac: one pass takes well over an hour,
      # and the retries come on top (the Flutter nightly allows 360 minutes too). Below the job
      # timeout, so an overrunning suite fails instead of cancelling the job, and the Allure upload,
      # the logs and the Slack report still run.
      - name: Run e2e tests
        timeout-minutes: 300
        working-directory: examples/SampleApp
        run: bundle exec fastlane test_e2e platform:ios skip_build:true mock_server_branch:"$MOCK_SERVER_BRANCH"
      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: examples/SampleApp
        run: bundle exec fastlane allure_upload launch_id:"$LAUNCH_ID"
      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: examples/SampleApp
        run: bundle exec fastlane allure_launch_removal launch_id:"$LAUNCH_ID"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-ios-nightly-logs-${{ matrix.ios }}
          path: |
            examples/E2ETestApp/stream-chat-test-mock-server/logs
            examples/E2ETestApp/artifacts

  # Built once per flavor and shared by the test jobs, as on pull requests.
  android-build:
    name: Build Android (${{ matrix.coverage && 'coverage' || 'plain' }})
    if: github.event_name == 'schedule' || inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The coverage runs need a bundle instrumented with E2E_COVERAGE; the others test the plain app.
        coverage: [true, false]
    env:
      APK_PATHS: |
        examples/E2ETestApp/android/app/build/outputs/apk/release/app-release.apk
        examples/E2ETestApp/android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
      # The emulator is x86_64: skip compiling native code for the other ABIs.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn workspaces focus e2etestapp
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # The nightly build is never cached, so every Gradle plugin and dependency is downloaded; a
      # transient repository outage (plugin portal, 2026-11-10) must not cost the whole night.
      - name: Build app
        working-directory: examples/E2ETestApp
        run: yarn e2e:build -c android.att.release || { sleep 60; yarn e2e:build -c android.att.release; }
        env:
          E2E_COVERAGE: ${{ matrix.coverage && '1' || '0' }}
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-android-apks-${{ matrix.coverage && 'coverage' || 'plain' }}
          path: ${{ env.APK_PATHS }}
          retention-days: 1

  android:
    name: Test Android API ${{ matrix.api-level }}${{ matrix.coverage && format(' coverage ({0})', matrix.batch) || '' }}
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Coverage runs every test in its own app process for the map that selects e2e tests on
          # pull requests. That is too slow for one runner, so its tests are split across batches.
          # coverage_map's batch_count must match.
          - { api-level: 36, coverage: true, batch: 0, batch_count: 4 }
          - { api-level: 36, coverage: true, batch: 1, batch_count: 4 }
          - { api-level: 36, coverage: true, batch: 2, batch_count: 4 }
          - { api-level: 36, coverage: true, batch: 3, batch_count: 4 }
          - { api-level: 34, batch: 0, batch_count: 1 }
          - { api-level: 31, batch: 0, batch_count: 1 }
          - { api-level: 28, batch: 0, batch_count: 1 }
    env:
      # swangle_indirect, not swiftshader_indirect: with the latter the emulator exits silently mid-run
      # (RN-513).
      ANDROID_EMULATOR_OPTIONS: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swangle_indirect -camera-back none -camera-front none
      DETOX_ADB_NAME: "emulator-5554"
      MOCK_SERVER_BUNDLE_PATH: ${{ github.workspace }}/../mock-server-gems
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - uses: ./.github/actions/ruby-cache

      - name: Restore node_modules
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.NODE_MODULES_PATHS }}
          key: ${{ runner.os }}-e2e-node-modules-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn workspaces focus e2etestapp
      - uses: actions/download-artifact@v7
        with:
          name: e2e-android-apks-${{ matrix.coverage && 'coverage' || 'plain' }}
          path: examples/E2ETestApp/android/app/build/outputs/apk

      # --- Emulator: same setup as the native Android SDK's e2e jobs (AOSP image, no Play services) ---
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve mock server revision
        id: mock-server
        run: echo "sha=$(git ls-remote https://github.com/GetStream/stream-chat-test-mock-server "refs/heads/$MOCK_SERVER_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache mock server gems
        uses: actions/cache@v5
        with:
          path: ${{ env.MOCK_SERVER_BUNDLE_PATH }}
          key: ${{ runner.os }}-mock-server-gems-${{ steps.mock-server.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-mock-server-gems-

      - name: Launch Allure TestOps
        if: env.ALLURE_TOKEN != ''
        working-directory: examples/SampleApp
        run: bundle exec fastlane allure_launch cron:true
        continue-on-error: true
      # The emulator runner downloads these without retrying; a corrupted download fails the job.
      - uses: ./.github/actions/android-sdk-packages
        with:
          api-level: ${{ matrix.api-level }}
      - name: Run e2e tests (Android emulator)
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel
          emulator-options: ${{ env.ANDROID_EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: examples/SampleApp
          # Logcat is written on the runner, so it survives the emulator dying mid-run (RN-513).
          script: |
            nohup "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -b all -v threadtime > "$RUNNER_TEMP/logcat.txt" 2>&1 < /dev/null &
            bundle exec fastlane test_e2e platform:android device:att skip_build:true mock_server_branch:"$MOCK_SERVER_BRANCH" coverage:${{ matrix.coverage == true }} batch:${{ matrix.batch }} batch_count:${{ matrix.batch_count }}

      # Also when tests failed: those keep their coverage from the previous map. Not when they never
      # ran: a batch without its failed-tests file keeps the whole previous map.
      - name: List the failed tests
        id: failed-tests
        if: ${{ !cancelled() && matrix.coverage && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        working-directory: examples/SampleApp
        run: bundle exec fastlane e2e_failed_tests batch:${{ matrix.batch }}
      # A tarball, as upload-artifact rejects some characters a test name (the folder name) may hold.
      - name: Pack the coverage
        if: ${{ !cancelled() && steps.failed-tests.outcome == 'success' }}
        working-directory: examples/E2ETestApp
        run: tar -czf e2e-coverage-batch-${{ matrix.batch }}.tgz e2e-coverage
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.failed-tests.outcome == 'success' }}
        with:
          name: e2e-coverage-batch-${{ matrix.batch }}
          path: examples/E2ETestApp/e2e-coverage-batch-${{ matrix.batch }}.tgz
          retention-days: 3

      - name: Upload Allure results
        if: env.LAUNCH_ID != '' && (success() || failure())
        working-directory: examples/SampleApp
        run: bundle exec fastlane allure_upload launch_id:"$LAUNCH_ID"
      - name: Allure TestOps Launch Removal
        if: env.LAUNCH_ID != '' && cancelled()
        working-directory: examples/SampleApp
        run: bundle exec fastlane allure_launch_removal launch_id:"$LAUNCH_ID"
      # The emulator has vanished mid-run without any output; this shows whether the kernel killed it.
      - name: Diagnose emulator
        if: failure()
        run: |
          sudo dmesg -T | grep -i -E 'out of memory|oom-kill|killed process' || echo "No OOM kills in dmesg"
          free -m
          df -h
          ls -la /tmp/android-runner 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-nightly-android-${{ matrix.api-level }}-batch-${{ matrix.batch }}
          path: |
            examples/E2ETestApp/stream-chat-test-mock-server/logs
            examples/E2ETestApp/artifacts
            /tmp/android-runner
            ${{ runner.temp }}/logcat.txt

  coverage_map:
    name: Build e2e coverage map
    needs: android
    # Failed tests keep their previous coverage; only a batch that never finished blocks the map.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.android) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ruby-cache
      - uses: actions/download-artifact@v7
        with:
          pattern: e2e-coverage-batch-*
          path: examples/E2ETestApp/batches
          merge-multiple: true
      - name: Merge the batches
        working-directory: examples/E2ETestApp
        run: |
          shopt -s nullglob
          for batch in batches/*.tgz; do tar -xzf "$batch"; done
      - name: Build the coverage map
        working-directory: examples/SampleApp
        run: bundle exec fastlane build_e2e_coverage_map batch_count:4
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage-map
          path: examples/E2ETestApp/e2e_coverage_map.json
          retention-days: 14

  slack:
    name: Slack Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ios, android-build, android, coverage_map]
    # always(): a job that hit its timeout is `cancelled`, which failure() alone doesn't see.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
      - uses: 8398a7/action-slack@v3
        with:
          status: cancelled
          text: 'You shall not pass!'
          job_name: '${{ github.workflow }}: ${{ github.job }}'
          fields: repo,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_NIGHTLY_CHECKS }}
