name: SDK Size

on:
  pull_request:

  workflow_dispatch:

  push:
    branches:
      - develop
      - main
      # Needed for the same reason as in check-pr.yml, and specifically for this initiative: moving the
      # i18n runtime out of `lib/` changes both numbers in the migration guide's size table, and this
      # workflow is what measures them.
      - V10

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1 # Disable cleanup for homebrew, we don't need it on CI

permissions:
  contents: read
  pull-requests: write # the size comment on the PR
  checks: read # skipping the check when an earlier commit already measured the same sources
  actions: read

jobs:
  sdk_size:
    name: Metrics
    runs-on: { group: github-public-amd64 }
    steps:
      # Short-lived token for pushing the size benchmark to stream-internal-metrics.
      - name: Create metrics token
        id: metrics-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JS_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.JS_CI_BOT_PRIVATE_KEY }}
          owner: GetStream
          repositories: stream-internal-metrics
          permission-contents: write

      - uses: actions/checkout@v6

      - uses: ./.github/actions/ruby-cache

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Run SDK Size Metrics
        run: bundle exec fastlane show_frameworks_sizes
        working-directory: examples/SampleApp
        timeout-minutes: 60
        env:
          GITHUB_PR_NUM: ${{ github.event.pull_request.number }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          # The metrics clone reads GITHUB_TOKEN; the PR comment goes through gh, which reads GH_TOKEN first.
          GITHUB_TOKEN: ${{ steps.metrics-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
