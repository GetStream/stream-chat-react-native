name: Release

on:
  push:
    branches:
      - main
      - develop
  # Manual runs cut pre-release (RC) builds from the branch that defines them. GitHub reads this
  # trigger from the default branch, so it has to live here even though develop never uses it.
  workflow_dispatch:

permissions:
  id-token: write # for OIDC / npm provenance if you use it
  actions: write # if you dispatch other workflows
  contents: write # commits / tags / merge-back

jobs:
  publish:
    # main and develop release on push only; a manual run there would cut an out-of-band release.
    if: github.event_name == 'push' || github.ref == 'refs/heads/V10'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.STREAM_CI_GITHUB_BOT_TOKEN }}
          fetch-depth: '0'

      - name: Fetch tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Prepare git
        run: |
          git config --global user.name 'stream-ci-bot'
          git config --global user.email 'stream-bot@getstream.io'

      - name: Install && Build - SDK and Sample App
        uses: ./.github/actions/install-and-build-sdk

      - name: Lint
        run: yarn lint

      - name: Test
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/V10'
        run: yarn test:coverage

      - name: Publish Next Release (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          GITHUB_SHORT_SHA="$(git rev-parse --short $GITHUB_SHA)" yarn release-next

      - name: Publish RC Release (V10)
        if: github.ref == 'refs/heads/V10'
        run: yarn release-next

      - name: Publish Release (main)
        if: github.ref == 'refs/heads/main'
        run: yarn release
        env:
          GH_TOKEN: ${{ secrets.STREAM_CI_GITHUB_BOT_TOKEN }}

      - name: Merge back changes (main -> develop)
        if: github.ref == 'refs/heads/main'
        run: |
          git stash
          git checkout develop
          git pull origin develop
          git merge main -m "chore: merge back release [skip ci]"
          git push origin develop
