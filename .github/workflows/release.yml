name: Release

on:
  push:
    branches:
      - main
      - develop
  # v9-release (the v9 maintenance branch) releases on manual runs only: Actions → Release → Run
  # workflow → branch `v9-release`. GitHub reads this trigger from the default branch, but a run uses
  # the workflow file of the branch it was started on, so the inputs and steps below are this branch's.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute the release version, publish nothing'
        type: boolean
        default: true

permissions:
  id-token: write # for OIDC / npm provenance if you use it
  actions: write # if you dispatch other workflows
  contents: write # commits / tags / merge-back

jobs:
  publish:
    # main and develop release on push only; a manual run there would cut an out-of-band release.
    if: github.event_name == 'push' || github.ref == 'refs/heads/v9-release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.STREAM_CI_GITHUB_BOT_TOKEN }}
          fetch-depth: '0'

      - name: Fetch tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Prepare git
        run: |
          git config --global user.name 'stream-ci-bot'
          git config --global user.email 'stream-bot@getstream.io'

      - name: Install && Build - SDK and Sample App
        uses: ./.github/actions/install-and-build-sdk

      - name: Lint
        run: yarn lint

      - name: Test
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/v9-release'
        run: yarn test:coverage

      - name: Publish Next Release (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          GITHUB_SHORT_SHA="$(git rev-parse --short $GITHUB_SHA)" yarn release-next

      - name: Publish Maintenance Release (v9-release)
        if: github.ref == 'refs/heads/v9-release'
        run: yarn release-next
        env:
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Publish Release (main)
        if: github.ref == 'refs/heads/main'
        run: yarn release
        env:
          GH_TOKEN: ${{ secrets.STREAM_CI_GITHUB_BOT_TOKEN }}

      - name: Merge back changes (main -> develop)
        if: github.ref == 'refs/heads/main'
        run: |
          git stash
          git checkout develop
          git pull origin develop
          git merge main -m "chore: merge back release [skip ci]"
          git push origin develop
